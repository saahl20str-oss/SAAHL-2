<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>استعادة كلمة المرور | ساهل-2</title>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="reset-password.js?v=2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3eb;color:#192537;font:16px/1.65 system-ui,sans-serif}
main{width:min(100% - 28px,460px);margin:clamp(26px,9vh,85px) auto;background:#fff;padding:clamp(18px,6vw,32px);border:1px solid #ebe1cc;border-radius:18px}
h1{font-size:clamp(23px,6vw,29px);margin:0 0 10px}p{margin:0 0 14px}label{display:block;font-weight:650}
input,button{width:100%;min-height:46px;padding:9px 12px;margin:6px 0 15px;border:1px solid #d9d1bd;border-radius:8px;font:inherit}
button{background:#e1c478;color:#172234;font-weight:750;cursor:pointer}button:disabled{opacity:.65;cursor:default}
a{color:#62490c}#feedback:not(:empty){background:#f8f4e8;padding:10px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1 id="title">استعادة كلمة المرور</h1>
<p id="feedback" role="status" aria-live="polite"></p>
<form id="request">
<label for="email">البريد الإلكتروني المرتبط بالحساب</label>
<input id="email" type="email" required autocomplete="email" dir="ltr">
<button type="submit">إرسال رابط الاستعادة</button>
</form>
<form id="change" hidden>
<label for="password">كلمة المرور الجديدة</label>
<input id="password" type="password" minlength="8" required autocomplete="new-password">
<label for="confirm">تأكيد كلمة المرور</label>
<input id="confirm" type="password" minlength="8" required autocomplete="new-password">
<button type="submit">حفظ كلمة المرور الجديدة</button>
</form>
<a href="./office.html">العودة إلى تسجيل الدخول</a>
</main>
</body>
</html>
