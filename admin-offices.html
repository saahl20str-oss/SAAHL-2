<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ساهل 2 | اعتماد المكاتب</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f7f5f0;color:#1c1c20;font-family:Tajawal,Arial,sans-serif}header{background:#111218;color:#dfc177;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none}main{max-width:1000px;margin:32px auto;padding:0 18px}h1{font-size:32px}p{color:#666;line-height:1.8}.panel{background:#fff;border:1px solid #e7dfcf;border-radius:17px;padding:24px;margin:18px 0}.hidden{display:none}input{width:100%;padding:13px;border:1px solid #ddd5c8;border-radius:9px;font:inherit;margin:8px 0}button{background:#c9a84c;border:0;padding:12px 19px;border-radius:9px;font:inherit;font-weight:800;cursor:pointer;margin:5px}.secondary{background:#eeeae0}.office{padding:18px;border:1px solid #e9e3d9;border-radius:12px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.office strong{font-size:18px}.office small{display:block;color:#777;margin-top:7px}.error{color:#aa2424}.success{color:#23784e}.pill{border-radius:30px;padding:7px 12px;background:#faf2dd;color:#866923;font-size:13px}</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><strong>ساهل 2 — إدارة اعتماد المكاتب</strong><a href="index.html">الصفحة الرئيسية</a></header><main><h1>طلبات اعتماد مكاتب الاستقدام</h1><p>الاعتماد محصور بالمدير الرئيسي. راجع الترخيص وبيانات المكتب قبل الموافقة، ولا تعتمد المكتب دون التحقق من الترخيص عبر القنوات الرسمية.</p><p id="msg" role="status"></p><section class="panel" id="loginBox"><h2>دخول المدير</h2><label>البريد الإلكتروني<input type="email" id="email" autocomplete="email" placeholder="البريد المعتمد"></label><label>كلمة المرور<input type="password" id="password" autocomplete="current-password"></label><button id="login">تسجيل الدخول</button></section><section id="adminPanel" class="hidden"><div class="panel"><button id="refresh">تحديث الطلبات</button><button id="logout" class="secondary">تسجيل الخروج</button><div id="offices"></div></div></section></main><script>window.addEventListener('load',()=>{const db=supabase.createClient('https://hkfxikmpfgixrbrboxeb.supabase.co','sb_publishable_OcWY5nY_-b2odLqQxsu2Kw_iQ4YswBz');const $=id=>document.getElementById(id),msg=(t,bad=false)=>{$('msg').textContent=t;$('msg').className=bad?'error':'success'};let user=null;async function init(){let {data}=await db.auth.getUser();user=data?.user||null;let isAdmin=false;if(user){let {data:profile}=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();isAdmin=['ADMIN','admin'].includes(profile?.role)}$('loginBox').classList.toggle('hidden',!!user&&isAdmin);$('adminPanel').classList.toggle('hidden',!isAdmin);if(user&&!isAdmin)msg('هذا الحساب لا يملك صلاحية الإدارة الرئيسية.',true);if(isAdmin){msg('');await load()}}$('login').onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg('تعذر الدخول: '+error.message,true);await init()};$('logout').onclick=async()=>{await db.auth.signOut();await init()};$('refresh').onclick=load;async function load(){let {data,error}=await db.from('offices').select('id,name,license_number,emirate,phone,status,created_at').order('created_at',{ascending:false});if(error)return msg('تعذر تحميل المكاتب: '+error.message,true);const root=$('offices');root.innerHTML='';if(!data.length){root.textContent='لا توجد مكاتب مسجلة حالياً.';return}for(const office of data){const row=document.createElement('div');row.className='office';const details=document.createElement('div');const title=document.createElement('strong');title.textContent=office.name;const info=document.createElement('small');info.textContent='الترخيص: '+office.license_number+' | الإمارة: '+office.emirate+' | الهاتف: '+office.phone;const status=document.createElement('span');status.className='pill';status.textContent=({'pending':'بانتظار الاعتماد','approved':'معتمد','rejected':'مرفوض','suspended':'موقوف'})[office.status]||office.status;details.append(title,info,status);const controls=document.createElement('div');for(const [value,label] of [['approved','اعتماد المكتب'],['rejected','رفض الطلب'],['suspended','إيقاف المكتب']]){if(value===office.status)continue;const btn=document.createElement('button');btn.textContent=label;btn.className=value==='approved'?'':'secondary';btn.onclick=async()=>{if(!confirm('تأكيد '+label+' للمكتب '+office.name+'؟'))return;btn.disabled=true;let {error}=await db.from('offices').update({status:value}).eq('id',office.id);if(error){msg('تعذر تحديث حالة المكتب: '+error.message,true);btn.disabled=false}else{msg('تم تحديث حالة المكتب بنجاح');await load()}};controls.appendChild(btn)}row.append(details,controls);root.appendChild(row)}}init()});</script></body></html>
