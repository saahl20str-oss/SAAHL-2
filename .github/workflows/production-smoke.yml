name: Verify published SAAHL-2
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '**.webmanifest'
      - 'tests/production-smoke.mjs'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:
jobs:
  published-site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/production-smoke.mjs
