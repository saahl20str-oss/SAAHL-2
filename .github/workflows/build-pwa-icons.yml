name: Generate safe SAAHL-2 PWA raster icons
on:
  push:
    branches: [verify-live-mobile-20261119]
    paths: ['.github/workflows/build-pwa-icons.yml']
permissions:
  contents: write
jobs:
  icon-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cairosvg
      - name: Render PNG icons from checked-in SVG
        run: |
          python - <<'PY'
          import cairosvg
          for size, filename in [(192,'saahl-pwa-192.png'),(512,'saahl-pwa-512.png'),(180,'apple-touch-icon.png')]:
              cairosvg.svg2png(url='saahl-pwa-icon.svg',write_to=filename,output_width=size,output_height=size)
          PY
      - name: Commit generated images on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saahl-pwa-192.png saahl-pwa-512.png apple-touch-icon.png
          git diff --cached --quiet || git commit -m "Add raster install icons for Android and iPhone"
          git push origin HEAD:verify-live-mobile-20261119
