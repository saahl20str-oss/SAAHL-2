name: SAAHL-2 production live browser check
on:
  workflow_dispatch:
  pull_request:
    paths: ['tests/live-production-smoke.mjs','.github/workflows/live-production-smoke.yml']
  push:
    branches: [main]
    paths: ['tests/live-production-smoke.mjs','.github/workflows/live-production-smoke.yml']
jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-production-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saahl2-production-phone-and-desktop
          path: production-previews/
          if-no-files-found: ignore
