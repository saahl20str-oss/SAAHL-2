name: SAAHL-2 mobile browser smoke
on:
  pull_request:
    paths:
      - '**.html'
      - 'mobile-first.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'saahl-pwa-icon.svg'
      - 'tests/**'
      - '.github/workflows/mobile-smoke.yml'
  workflow_dispatch:
jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/mobile-smoke.mjs
