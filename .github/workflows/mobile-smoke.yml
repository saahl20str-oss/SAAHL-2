name: SAAHL-2 mobile browser smoke
on:
  pull_request:
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - '**.webmanifest'
      - 'supabase/migrations/**'
      - 'tests/**'
      - '.github/workflows/mobile-smoke.yml'
  workflow_dispatch:
jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - id: chromium
        run: npx playwright install --with-deps chromium
      - run: node --check kafala-owner.js
      - run: node --check kafala-whatsapp.js
      - run: node --check pwa-install.js
      - run: node --check notifications-inbox.js
      - run: node tests/admin-review-smoke.mjs
      - run: node tests/mobile-smoke.mjs
      - if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/office-announcement-smoke.mjs
      - if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/worker-publication-smoke.mjs
      - if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/transfer-public-profile-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saahl2-mobile-previews
          path: mobile-preview/
          if-no-files-found: ignore
